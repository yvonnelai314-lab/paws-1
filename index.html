<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWS | 日韓潮流選物</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1a1a1a; --paper: #f9f7f4; --accent: #b08e61; --soft: #e5e0d8; --muted: #7a736a; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink); font-weight: 300; overflow-x: hidden; }
  
  /* 導覽列 */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 4rem; background: rgba(249, 247, 244, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(176, 142, 97, 0.1); }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 0.2em; color: var(--ink); text-decoration: none; }
  .nav-logo span { color: var(--accent); }
  .cart-btn { position: relative; background: none; border: none; cursor: pointer; font-size: 1.2rem; }
  .cart-count { position: absolute; top: -5px; right: -8px; background: var(--accent); color: #fff; font-size: 0.6rem; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  /* 主視覺 */
  .hero { height: 45vh; display: flex; align-items: center; justify-content: center; background: #222 url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=2000') no-repeat center/cover; background-blend-mode: overlay; }
  .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(4rem, 8vw, 6rem); color: #fff; letter-spacing: 0.15em; }

  /* 商品展示區 */
  .product-container { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 3rem; }
  .product-card { background: var(--white); position: relative; transition: transform 0.3s ease; }
  .product-img-wrapper { aspect-ratio: 1/1; overflow: hidden; position: relative; background: #eee; }
  .product-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .product-card:hover .product-img { transform: scale(1.08); }
  
  .add-to-cart { position: absolute; bottom: 0; left: 0; right: 0; background: var(--ink); color: #fff; padding: 1.2rem; border: none; transform: translateY(100%); transition: 0.3s; cursor: pointer; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .product-img-wrapper:hover .add-to-cart { transform: translateY(0); }
  
  .product-info { padding: 1.5rem 1rem; text-align: center; }
  .product-name { font-size: 0.9rem; margin-bottom: 0.5rem; letter-spacing: 0.05em; color: var(--ink); }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--accent); }

  /* 購物車與結帳彈窗 */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: 0.4s; }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 450px; max-width: 100vw; background: var(--white); z-index: 201; transform: translateX(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; padding: 2.5rem; }
  .drawer.open { transform: translateX(0); }
  
  #checkoutModal { right: auto; left: 50%; transform: translateX(-50%) translateY(100%); bottom: auto; top: 5%; height: 90vh; border-radius: 12px; }
  #checkoutModal.open { transform: translateX(-50%) translateY(0); }

  .form-group { margin-bottom: 1.2rem; }
  .form-label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .form-input { width: 100%; padding: 0.9rem; border: 1px solid var(--soft); background: var(--paper); outline: none; font-family: inherit; font-size: 0.9rem; }
  .form-input:focus { border-color: var(--accent); }

  .primary-btn { width: 100%; padding: 1.2rem; background: var(--ink); color: #fff; border: none; cursor: pointer; letter-spacing: 0.25em; font-size: 0.8rem; text-transform: uppercase; transition: background 0.3s; }
  .primary-btn:hover { background: var(--accent); }

  .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #f5f5f5; padding-bottom: 10px; }
  .cart-item-img { width: 65px; height: 65px; object-fit: cover; border-radius: 2px; }

  @media (max-width: 768px) { nav { padding: 1.2rem 2rem; } #checkoutModal { width: 95vw; } }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">PAW<span>S</span></a>
  <button class="cart-btn" onclick="toggleCart()">🛍 <span class="cart-count" id="cartCount">0</span></button>
</nav>

<section class="hero"><h1 class="hero-title">PAWS</h1></section>

<div class="product-container">
  <div class="products-grid" id="productGrid"><p style="text-align:center; grid-column:1/-1;">正在載入日韓選物清單...</p></div>
</div>

<!-- 購物車側欄 -->
<div class="drawer-overlay" id="overlay" onclick="toggleCart()"></div>
<div class="drawer" id="cartDrawer">
  <h2 style="font-family: 'Cormorant Garamond', serif; margin-bottom: 2.5rem; letter-spacing: 0.1em;">Shopping Bag</h2>
  <div id="cartItems" style="flex:1; overflow-y:auto;"></div>
  <div style="border-top: 1px solid var(--soft); padding-top: 1.5rem;">
    <p id="cartTotal" style="font-size: 1.6rem; margin-bottom: 1.5rem; font-family: 'Cormorant Garamond', serif;">NT$ 0</p>
    <button class="primary-btn" onclick="openCheckout()">Checkout ❯</button>
  </div>
</div>

<!-- 結帳表單彈窗 -->
<div class="drawer-overlay" id="checkoutOverlay" onclick="closeCheckout()"></div>
<div class="drawer" id="checkoutModal">
  <h2 style="font-family: 'Cormorant Garamond', serif; margin-bottom: 2rem; letter-spacing: 0.1em;">Shipping Details</h2>
  <div style="overflow-y:auto; flex: 1; padding-right: 5px;">
    <div class="form-group"><label class="form-label">收件人姓名</label><input type="text" id="custName" class="form-input" placeholder="請填寫真實姓名"></div>
    <div class="form-group"><label class="form-label">電話</label><input type="tel" id="custPhone" class="form-input" placeholder="09xx-xxx-xxx"></div>
    <div class="form-group"><label class="form-label">電子信箱</label><input type="email" id="custEmail" class="form-input" placeholder="your@email.com"></div>
    <div class="form-group">
      <label class="form-label">7-11 門市名稱/店號</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="custStore" class="form-input" placeholder="例如：三興店 / 123456">
        <a href="https://emap.pcsc.com.tw/" target="_blank" style="font-size:0.65rem; color:var(--accent); text-decoration:none; align-self:center; border:1px solid var(--accent); padding:6px 10px; white-space:nowrap;">查詢門市</a>
      </div>
    </div>
    <div class="form-group"><label class="form-label">匯款帳號末五碼</label><input type="text" id="custBank" class="form-input" placeholder="匯款後請填寫以利對帳"></div>
    
    <div id="orderSummary" style="background:#f7f7f7; padding:1.5rem; margin:1.5rem 0; font-size:0.85rem; line-height:1.7; border-left: 3px solid var(--accent);">
        <!-- 自動生成訂單明細 -->
    </div>
    
    <button class="primary-btn" onclick="sendToGoogle()">Confirm & Send Order ❯</button>
  </div>
</div>

<script>
  // 後台試算表配置
  const SPREADSHEET_ID = "1w0TnBgPXoN7geL4XjPpAW5D2Flok6kwXxfUzr72gSBc";
  const TAB_NAME = "工作表1"; 
  const DATA_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${TAB_NAME}`;

  let PRODUCTS = [];
  let cart = [];

  // 從 Google Sheets 抓取商品資料
  async function fetchProducts() {
    try {
      const response = await fetch(DATA_URL);
      const data = await response.text();
      const rows = data.split('\n').slice(1);
      PRODUCTS = rows.map(row => {
        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
        return { id: cols[0], name: cols[1], price: parseInt(cols[2]), img: cols[3] };
      }).filter(p => p.name && !isNaN(p.price));
      renderUI();
    } catch (e) { 
      document.getElementById('productGrid').innerHTML = "<p style='text-align:center; grid-column:1/-1;'>載入失敗，請確認試算表已「發佈到網路」。</p>"; 
    }
  }

  function renderUI() {
    document.getElementById('productGrid').innerHTML = PRODUCTS.map(p => `
      <div class="product-card">
        <div class="product-img-wrapper">
          <img src="${p.img}" class="product-img" onerror="this.src='https://placehold.co/500x500?text=PAWS+Collection'">
          <button class="add-to-cart" onclick="addToCart('${p.id}')">Add to Bag</button>
        </div>
        <div class="product-info">
          <p class="product-name">${p.name}</p>
          <p class="product-price">NT$ ${p.price.toLocaleString()}</p>
        </div>
      </div>`).join('');
  }

  function addToCart(id) {
    const p = PRODUCTS.find(x => x.id == id);
    const item = cart.find(i => i.id == id);
    if (item) item.qty++; else cart.push({...p, qty:1});
    updateCart();
    alert(`已加入購物車：${p.name}`);
  }

  function updateCart() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const count = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').innerText = count;
    document.getElementById('cartTotal').innerText = `NT$ ${total.toLocaleString()}`;
    document.getElementById('cartItems').innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.img}" class="cart-item-img">
        <div style="flex:1;">
          <p style="font-size:0.85rem; font-weight:400; margin-bottom:3px;">${i.name}</p>
          <p style="font-size:0.75rem; color:var(--accent);">NT$ ${i.price.toLocaleString()} x ${i.qty}</p>
        </div>
        <button onclick="removeFromCart('${i.id}')" style="background:none; border:none; color:#ddd; cursor:pointer; font-size:1rem;">✕</button>
      </div>`).join('');
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id != id);
    updateCart();
  }

  function toggleCart() { document.getElementById('cartDrawer').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
  
  function openCheckout() {
    if (cart.length === 0) return alert('購物車內目前沒有商品喔！');
    const itemsText = cart.map(i => `${i.name} x ${i.qty}`).join('<br>');
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('orderSummary').innerHTML = `<strong>訂單彙整：</strong><br>${itemsText}<br><br><strong>應付總額：NT$ ${total.toLocaleString()}</strong>`;
    toggleCart();
    document.getElementById('checkoutModal').classList.add('open');
    document.getElementById('checkoutOverlay').classList.add('open');
  }

  function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); document.getElementById('checkoutOverlay').classList.remove('open'); }

  // 核心：發送資料到 Google 表單
  function sendToGoogle() {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const store = document.getElementById('custStore').value;
    const bank = document.getElementById('custBank').value;
    
    if(!name || !phone || !store || !bank) return alert('為了確保正確採買，請填寫完整資訊與末五碼喔！');

    const formID = "1FAIpQLSfDTwFEZ1ILXx7JsYuWnJyAm02EKYmB6tTdrcxt3IWTBe3a1Q";
    const googleURL = `https://docs.google.com/forms/d/e/${formID}/formResponse?`;
    
    const params = new URLSearchParams({
        "entry.1529348949": name,                                       // 姓名
        "entry.202851324": phone,                                        // 電話
        "entry.2118948816": document.getElementById('custEmail').value,  // 信箱
        "entry.393497125": store,                                        // 7-11門市
        "entry.933475847": bank,                                         // 帳號末五碼
        "entry.1338477873": cart.map(i => `${i.name}x${i.qty}`).join(', '), // 訂單內容
        "entry.1788102968": cart.reduce((s, i) => s + i.price * i.qty, 0),  // 總金額
        "submit": "Submit"
    });

    fetch(googleURL + params.toString(), { mode: 'no-cors' }).then(() => {
        alert('PAWS 訂單已成功送出！\n我們會盡快核對款項並安排採買，謝謝。');
        cart = []; updateCart(); closeCheckout();
    }).catch(() => alert('發送失敗，請檢查網路連線或稍後再試。'));
  }

  window.onload = fetchProducts;
</script>
</body>
</html>
