<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWS | 日韓潮流選物</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+TC:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1a1a1a; --paper: #f9f7f4; --accent: #b08e61; --soft: #e5e0d8; --muted: #7a736a; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; padding-top: 80px; }

  nav { position: fixed; top: 0; width: 100%; z-index: 1000; display: flex; justify-content: space-between; padding: 1.2rem 5%; background: rgba(249, 247, 244, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--soft); }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.2em; text-decoration: none; color: var(--ink); }
  .nav-logo span { color: var(--accent); }
  .cart-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; position: relative; }
  .cart-count { position: absolute; top: -5px; right: -10px; background: var(--accent); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }
  
  /* 商品卡片強制樣式 */
  .product-card { background: white; border: 1px solid #f0f0f0; display: flex; flex-direction: column; height: 100%; }
  .img-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #eee; }
  .img-box img { width: 100%; height: 100%; object-fit: cover; }

  .p-info { padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .p-name { font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; height: 2.8em; overflow: hidden; }
  .p-price { font-family: 'Cormorant Garamond', serif; color: var(--accent); font-weight: 500; margin-bottom: 15px; font-size: 1.1rem; }

  /* 永遠顯示的黑色按鈕 */
  .add-btn { 
    display: block !important; 
    width: 100%; 
    padding: 15px; 
    background: #1a1a1a !important; 
    color: #ffffff !important; 
    border: none; 
    cursor: pointer; 
    font-size: 0.8rem; 
    letter-spacing: 0.15em; 
    text-transform: uppercase;
    margin-top: 10px;
    visibility: visible !important;
    opacity: 1 !important;
  }
  .add-btn:hover { background: var(--accent) !important; }

  /* 彈窗樣式 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 2000; }
  .overlay.show { display: block; }
  .drawer { position: fixed; background: white; z-index: 2001; transition: 0.4s ease; padding: 30px; }
  #cartDrawer { top: 0; right: 0; bottom: 0; width: 400px; transform: translateX(100%); display: flex; flex-direction: column; }
  #cartDrawer.show { transform: translateX(0); }
  .modal { top: 50%; left: 50%; width: 450px; max-width: 90vw; transform: translate(-50%, -50%) scale(0.9); border-radius: 12px; display: none; }
  .modal.show { display: block; transform: translate(-50%, -50%) scale(1); }

  /* 規格選擇按鈕 */
  .chip-container { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0 25px; }
  .chip { padding: 8px 20px; border: 1px solid var(--soft); border-radius: 25px; font-size: 0.85rem; cursor: pointer; background: white; }
  .chip.selected { background: #eeeeee; border-color: var(--ink); font-weight: 500; }

  .cart-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
  .cart-img { width: 60px; height: 60px; object-fit: cover; }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 12px 30px; border-radius: 4px; font-size: 0.8rem; display: none; z-index: 3000; }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">PAW<span>S</span></a>
  <button class="cart-btn" onclick="toggleCart(true)">🛍 <span class="cart-count" id="cartCount">0</span></button>
</nav>

<div class="container">
  <div class="products-grid" id="productGrid">
    <p style="text-align: center; grid-column: 1/-1;">正在載入 PAWS 精選選物...</p>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- 規格選擇彈窗 -->
<div id="variantModal" class="drawer modal">
  <h2 id="modalTitle" style="margin-bottom: 20px; font-family: 'Cormorant Garamond';">Select Options</h2>
  <div id="variantSelectors"></div>
  <div style="margin-bottom: 20px;">
    <span style="font-size: 0.9rem; font-weight: 500;">數量</span>
    <div style="display: flex; align-items: center; gap: 20px; margin-top: 10px;">
      <button onclick="changeQty(-1)" style="width:30px; height:30px; border:1px solid #ddd;">-</button>
      <span id="modalQty">1</span>
      <button onclick="changeQty(1)" style="width:30px; height:30px; border:1px solid #ddd;">+</button>
    </div>
  </div>
  <button class="add-btn" onclick="confirmAdd()">ADD TO BAG</button>
</div>

<!-- 購物車側欄 -->
<div id="cartDrawer" class="drawer">
  <h2 style="margin-bottom: 20px; font-family: 'Cormorant Garamond';">Your Bag</h2>
  <div id="cartItems" style="flex:1; overflow-y:auto;"></div>
  <div style="padding-top: 20px; border-top: 1px solid var(--soft);">
    <div style="display:flex; justify-content:space-between; font-size: 1.2rem; margin-bottom: 20px;">
      <span>Total</span><span id="cartTotal">NT$ 0</span>
    </div>
    <button class="add-btn" onclick="openCheckout()">CHECKOUT</button>
  </div>
</div>

<!-- 結帳表單 -->
<div id="checkoutModal" class="drawer modal">
  <h2 style="margin-bottom: 20px; font-family: 'Cormorant Garamond';">Shipping Detail</h2>
  <div style="margin-bottom: 15px;"><label style="font-size: 0.75rem;">收件姓名</label><input type="text" id="cName" style="width:100%; padding:10px;"></div>
  <div style="margin-bottom: 15px;"><label style="font-size: 0.75rem;">電話</label><input type="tel" id="cPhone" style="width:100%; padding:10px;"></div>
  <div style="margin-bottom: 15px;"><label style="font-size: 0.75rem;">電子信箱</label><input type="email" id="cEmail" style="width:100%; padding:10px;"></div>
  <div style="margin-bottom: 15px;"><label style="font-size: 0.75rem;">7-11 門市</label><input type="text" id="cStore" style="width:100%; padding:10px;"></div>
  <div style="margin-bottom: 15px;"><label style="font-size: 0.75rem;">匯款末五碼</label><input type="text" id="cBank" style="width:100%; padding:10px;"></div>
  <div id="checkoutSummary" style="font-size: 0.8rem; background: #f5f5f5; padding: 15px; margin: 10px 0;"></div>
  <button class="add-btn" onclick="sendToGoogle()">SEND ORDER</button>
</div>

<div id="toast"></div>

<script>
  const SHEET_ID = "1w0TnBgPXoN7geL4XjPpAW5D2Flok6kwXxfUzr72gSBc";
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let PRODUCTS = [];
  let cart = [];
  let currentProduct = null;
  let currentModalQty = 1;
  let selectedVariants = {};

  async function fetchProducts() {
    try {
      const resp = await fetch(SHEET_URL);
      const text = await resp.text();
      const json = JSON.parse(text.substr(47).slice(0, -2));
      PRODUCTS = json.table.rows.map((r, i) => ({
        id: i + 1,
        name: r.c[1]?.v || "未命名商品",
        price: r.c[2]?.v || 0,
        img: r.c[3]?.v || "",
        variants: r.c[4]?.v || ""
      }));
      renderProducts();
    } catch (e) { 
        document.getElementById('productGrid').innerHTML = "<p>抓取失敗，請確認試算表權限。</p>";
    }
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = PRODUCTS.map(p => `
      <div class="product-card">
        <div class="img-box"><img src="${p.img}"></div>
        <div class="p-info">
          <div>
            <div class="p-name">${p.name}</div>
            <div class="p-price">NT$ ${p.price.toLocaleString()}</div>
          </div>
          <button class="add-btn" onclick="handleAddToCart(${p.id})">ADD TO BAG</button>
        </div>
      </div>
    `).join('');
  }

  function handleAddToCart(id) {
    currentProduct = PRODUCTS.find(p => p.id === id);
    currentModalQty = 1;
    selectedVariants = {};
    if (!currentProduct.variants || currentProduct.variants.trim() === "") {
      addDirectly("Standard", 1);
    } else {
      openVariantModal();
    }
  }

  function openVariantModal() {
    const container = document.getElementById('variantSelectors');
    container.innerHTML = "";
    document.getElementById('modalTitle').innerText = currentProduct.name;
    document.getElementById('modalQty').innerText = 1;

    const groups = currentProduct.variants.split('|');
    groups.forEach(g => {
      const parts = g.split(':');
      if(parts.length < 2) return;
      const [label, optsStr] = parts;
      const opts = optsStr.split(',');
      const groupDiv = document.createElement('div');
      groupDiv.innerHTML = `<span style="font-size: 0.8rem; color: #777;">${label}</span>`;
      const chipContainer = document.createElement('div');
      chipContainer.className = 'chip-container';
      opts.forEach((o, idx) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = o.trim();
        if(idx === 0) { chip.classList.add('selected'); selectedVariants[label] = o.trim(); }
        chip.onclick = () => {
          chipContainer.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          selectedVariants[label] = o.trim();
        };
        chipContainer.appendChild(chip);
      });
      groupDiv.appendChild(chipContainer);
      container.appendChild(groupDiv);
    });

    document.getElementById('overlay').style.display = 'block';
    document.getElementById('variantModal').classList.add('show');
  }

  function changeQty(n) {
    currentModalQty = Math.max(1, currentModalQty + n);
    document.getElementById('modalQty').innerText = currentModalQty;
  }

  function confirmAdd() {
    const varName = Object.values(selectedVariants).join(' / ') || "Standard";
    addDirectly(varName, currentModalQty);
    closeAll();
  }

  function addDirectly(varName, qty) {
    const key = `${currentProduct.id}-${varName}`;
    const exist = cart.find(i => `${i.id}-${i.variant}` === key);
    if (exist) exist.qty += qty;
    else cart.push({ ...currentProduct, variant: varName, qty: qty });
    updateUI();
    showToast(`已加入購物袋`);
  }

  function updateUI() {
    document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartTotal').innerText = `NT$ ${cart.reduce((s, i) => s + i.price * i.qty, 0).toLocaleString()}`;
    document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
      <div class="cart-item">
        <img src="${i.img}" class="cart-img">
        <div style="flex:1">
          <div style="font-size:0.85rem">${i.name}</div>
          <div style="font-size:0.7rem; color:var(--accent);">${i.variant === 'Standard' ? '' : '['+i.variant+']'} NT$ ${i.price.toLocaleString()} x ${i.qty}</div>
        </div>
        <button onclick="remove(${idx})" style="background:none; border:none; color:#ccc; cursor:pointer;">✕</button>
      </div>
    `).join('');
  }

  function remove(idx) { cart.splice(idx, 1); updateUI(); }
  function toggleCart(show) { 
    document.getElementById('overlay').style.display = show ? 'block' : 'none';
    document.getElementById('cartDrawer').classList.toggle('show', show);
  }

  function openCheckout() {
    if(!cart.length) return;
    const items = cart.map(i => `${i.name}${i.variant==='Standard'?'':'('+i.variant+')'}x${i.qty}`).join(', ');
    document.getElementById('checkoutSummary').innerText = `訂單：${items}`;
    toggleCart(false);
    document.getElementById('overlay').style.display = 'block';
    document.getElementById('checkoutModal').classList.add('show');
  }

  function closeAll() {
    document.getElementById('overlay').style.display = 'none';
    document.querySelectorAll('.drawer').forEach(d => d.classList.remove('show'));
  }

  function sendToGoogle() {
    const data = {
      name: document.getElementById('cName').value,
      phone: document.getElementById('cPhone').value,
      email: document.getElementById('cEmail').value,
      store: document.getElementById('cStore').value,
      bank: document.getElementById('cBank').value
    };
    if(Object.values(data).some(v => !v)) return alert("請填寫資訊");

    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const items = cart.map(i => `${i.name}${i.variant==='Standard'?'':'('+i.variant+')'}x${i.qty}`).join(', ');

    const formID = "1FAIpQLSfDTwFEZ1ILXx7JsYuWnJyAm02EKYmB6tTdrcxt3IWTBe3a1Q";
    const googleURL = `https://docs.google.com/forms/d/e/${formID}/formResponse?`;
    const params = new URLSearchParams({
      "entry.1529348949": data.name, "entry.202851324": data.phone,
      "entry.2118948816": data.email, "entry.393497125": data.store,
      "entry.1338477873": data.bank, "entry.1788102968": items,
      "entry.1235108622": total, "submit": "Submit"
    });

    fetch(googleURL + params.toString(), { mode: 'no-cors' }).then(() => {
      alert("訂單已送出"); cart = []; updateUI(); closeAll();
    });
  }

  function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  window.onload = fetchProducts;
</script>
</body>
</html>
