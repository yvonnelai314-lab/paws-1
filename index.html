<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWS | 日韓潮流選物官網</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f9f7f4;
    --accent: #b08e61;
    --soft: #e5e0d8;
    --muted: #7a736a;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-weight: 300;
  }

  /* ── NAVIGATION ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 4rem;
    background: rgba(249, 247, 244, 0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(176, 142, 97, 0.1);
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem; letter-spacing: 0.2em;
    color: var(--ink); text-decoration: none;
  }
  .nav-logo span { color: var(--accent); }

  .cart-btn {
    position: relative; background: none; border: none; cursor: pointer;
    font-size: 1.2rem; color: var(--ink);
  }
  .cart-count {
    position: absolute; top: -5px; right: -8px;
    background: var(--accent); color: #fff;
    font-size: 0.6rem; width: 18px; height: 18px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }

  /* ── HERO ── */
  .hero {
    height: 60vh; display: flex; align-items: center; justify-content: center;
    background: #222 url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=2000') no-repeat center/cover;
    background-blend-mode: overlay;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 10vw, 7rem); font-weight: 300; color: var(--white);
    letter-spacing: 0.1em;
  }

  /* ── PRODUCTS ── */
  .section-header { text-align: center; padding: 6rem 2rem 3rem; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; }

  .product-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem 8rem; }
  .products-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 3rem;
  }

  .product-card { position: relative; background: var(--white); }
  .product-img-wrapper { aspect-ratio: 1/1; overflow: hidden; position: relative; background: #eee; }
  .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .product-card:hover .product-img { transform: scale(1.08); }

  .add-to-cart {
    position: absolute; bottom: 0; left: 0; right: 0; background: var(--ink); color: #fff;
    padding: 1.2rem; font-size: 0.75rem; letter-spacing: 0.2em; text-align: center;
    transform: translateY(100%); transition: transform 0.3s; cursor: pointer; border: none;
  }
  .product-img-wrapper:hover .add-to-cart { transform: translateY(0); }

  .product-info { padding: 1.5rem 1rem; text-align: center; }
  .product-name { font-size: 0.95rem; font-weight: 400; margin-bottom: 0.5rem; }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--accent); }

  /* ── DRAWER ── */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 450px; max-width: 100vw;
    background: var(--white); z-index: 201; transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column; padding: 2.5rem;
  }
  .drawer.open { transform: translateX(0); }

  #checkoutModal {
    right: auto; left: 50%; transform: translateX(-50%) translateY(100%);
    bottom: auto; top: 5%; height: 90vh; border-radius: 12px;
  }
  #checkoutModal.open { transform: translateX(-50%) translateY(0); }

  .drawer-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--soft); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
  .drawer-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; }

  .cart-items { flex: 1; overflow-y: auto; }
  .cart-item { display: flex; gap: 1.2rem; margin-bottom: 1.5rem; align-items: center; border-bottom: 1px solid #f9f9f9; padding-bottom: 1rem; }
  .cart-item-img { width: 60px; height: 60px; object-fit: cover; }

  /* ── FORM ── */
  .form-group { margin-bottom: 1.2rem; }
  .form-label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .form-input { width: 100%; padding: 0.8rem; border: 1px solid var(--soft); background: var(--paper); font-size: 0.9rem; outline: none; }

  .primary-btn {
    width: 100%; padding: 1.2rem; background: var(--ink); color: var(--white);
    border: none; letter-spacing: 0.3em; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
  }
  .primary-btn:hover { background: var(--accent); }

  #toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(150%);
    background: var(--ink); color: var(--white); padding: 1rem 2.5rem; font-size: 0.8rem; transition: transform 0.4s; z-index: 1000;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px) { nav { padding: 1rem 2rem; } #checkoutModal { width: 95vw; } }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">PAW<span>S</span></a>
  <button class="cart-btn" onclick="toggleCart()">
    🛍 <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>

<section class="hero"><h1 class="hero-title">PAWS</h1></section>

<section id="products">
  <div class="section-header">
    <span style="letter-spacing: 0.3em; font-size: 0.7rem; color: var(--accent);">CURATED COLLECTION</span>
    <h2 class="section-title">New Arrivals</h2>
  </div>
  <div class="product-container"><div class="products-grid" id="productGrid"></div></div>
</section>

<!-- 購物車 -->
<div class="drawer-overlay" id="overlay" onclick="toggleCart()"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-header">
    <h2 class="drawer-title">Shopping Bag</h2>
    <button onclick="toggleCart()" style="background:none; border:none; cursor:pointer;">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-footer">
    <div style="display:flex; justify-content:space-between; margin: 1.5rem 0; font-family:'Cormorant Garamond',serif; font-size:1.4rem;">
      <span>Total</span><span id="cartTotal">NT$ 0</span>
    </div>
    <button class="primary-btn" onclick="openCheckout()">Checkout ❯</button>
  </div>
</div>

<!-- 結帳彈窗 -->
<div class="drawer-overlay" id="checkoutOverlay" onclick="closeCheckout()"></div>
<div class="drawer" id="checkoutModal">
  <div class="drawer-header">
    <h2 class="drawer-title">Shipping & Payment</h2>
    <button onclick="closeCheckout()" style="background:none; border:none; cursor:pointer;">✕</button>
  </div>
  <div style="overflow-y: auto; flex: 1;">
    <p style="font-size:0.75rem; color:var(--accent); margin-bottom:1.5rem;">※ 請匯款完成後再填寫訂單</p>
    <div class="form-group"><label class="form-label">收件人姓名</label><input type="text" id="custName" class="form-input"></div>
    <div class="form-group"><label class="form-label">電話</label><input type="tel" id="custPhone" class="form-input"></div>
    <div class="form-group"><label class="form-label">電子信箱</label><input type="email" id="custEmail" class="form-input"></div>
    <div class="form-group"><label class="form-label">7-11 收件門市</label>
      <div style="display:flex; gap:8px;"><input type="text" id="custStore" class="form-input"><a href="https://emap.pcsc.com.tw/" target="_blank" style="font-size:0.6rem; color:var(--accent); text-decoration:none; align-self:center; border:1px solid; padding:4px;">查詢</a></div>
    </div>
    <div class="form-group"><label class="form-label">匯款帳號末五碼</label><input type="text" id="custBank" class="form-input"></div>
    <div id="orderSummary" style="background:#f0f0f0; padding:1.2rem; margin:1.5rem 0; font-size:0.85rem; line-height:1.6;"></div>
    <button class="primary-btn" onclick="sendToGoogle()">Confirm & Send ❯</button>
  </div>
</div>

<div id="toast">Added to bag</div>

<script>
  const PRODUCTS = [
    { id: 1, name: "Mardi Mercredi 經典大學T", price: 1850, img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=800" },
    { id: 2, name: "Le Labo 日本限定香氛 15ml", price: 3200, img: "https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?q=80&w=800" },
    { id: 3, name: "PAWS 刺繡工裝長褲", price: 2180, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=800" },
    { id: 4, name: "Tamburins 貝殼護手霜", price: 920, img: "https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?q=80&w=800" },
    { id: 5, name: "日系極簡皮革側背包", price: 1580, img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=800" },
    { id: 6, name: "韓國設計師款棒球帽", price: 1100, img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=800" }
  ];

  let cart = [];

  function renderProducts() {
    document.getElementById('productGrid').innerHTML = PRODUCTS.map(p => `
      <div class="product-card">
        <div class="product-img-wrapper">
          <img src="${p.img}" class="product-img">
          <button class="add-to-cart" onclick="addToCart(${p.id})">ADD TO BAG</button>
        </div>
        <div class="product-info">
          <h3 class="product-name">${p.name}</h3>
          <p class="product-price">NT$ ${p.price.toLocaleString()}</p>
        </div>
      </div>`).join('');
  }

  function addToCart(id) {
    const p = PRODUCTS.find(x => x.id === id);
    const item = cart.find(x => x.id === id);
    if (item) item.qty++; else cart.push({ ...p, qty: 1 });
    updateCartUI();
    showToast('Added to bag');
  }

  function updateCartUI() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartTotal').innerText = `NT$ ${total.toLocaleString()}`;
    document.getElementById('cartItems').innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.img}" class="cart-item-img">
        <div class="cart-item-info">
          <p style="font-size:0.85rem;">${i.name}</p>
          <p style="font-size:0.75rem; color:var(--accent);">NT$ ${i.price.toLocaleString()} x ${i.qty}</p>
        </div>
        <button onclick="removeFromCart(${i.id})" style="background:none; border:none; color:#ccc; cursor:pointer;">✕</button>
      </div>`).join('');
  }

  function removeFromCart(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }
  function toggleCart() { document.getElementById('cartDrawer').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
  function openCheckout() {
    if(!cart.length) return;
    const items = cart.map(i => `${i.name}(${i.qty})`).join(', ');
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('orderSummary').innerHTML = `<strong>訂單內容：</strong><br>${items}<br><strong>總額：NT$ ${total.toLocaleString()}</strong>`;
    toggleCart(); document.getElementById('checkoutModal').classList.add('open'); document.getElementById('checkoutOverlay').classList.add('open');
  }
  function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); document.getElementById('checkoutOverlay').classList.remove('open'); }

  function sendToGoogle() {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const email = document.getElementById('custEmail').value;
    const store = document.getElementById('custStore').value;
    const bank = document.getElementById('custBank').value;
    if (!name || !phone || !email || !store || !bank) return alert('請完整填寫資訊');

    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const itemsList = cart.map(i => `${i.name}x${i.qty}`).join(', ');

    const formID = "1FAIpQLSfDTwFEZ1ILXx7JsYuWnJyAm02EKYmB6tTdrcxt3IWTBe3a1Q";
    const googleURL = `https://docs.google.com/forms/d/e/${formID}/formResponse?`;
    
    const params = new URLSearchParams({
        "entry.1529348949": name,
        "entry.202851324": phone,
        "entry.2118948816": email,
        "entry.393497125": store,
        "entry.1338477873": bank,
        "entry.1788102968": itemsList,
        "entry.1235108622": total,
        "submit": "Submit"
    });

    fetch(googleURL + params.toString(), { mode: 'no-cors' })
      .then(() => { alert('訂單已送出！請核對信箱確認信。'); cart = []; updateCartUI(); closeCheckout(); })
      .catch(() => alert('提交失敗'));
  }

  function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
  renderProducts();
</script>
</body>
</html>
