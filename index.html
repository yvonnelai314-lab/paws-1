<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWS | 精選選物詳情版</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+TC:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1a1a1a; --paper: #f9f7f4; --accent: #b08e61; --soft: #e5e0d8; --muted: #7a736a; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; padding-top: 80px; }

  nav { position: fixed; top: 0; width: 100%; z-index: 1000; display: flex; justify-content: space-between; padding: 1.2rem 5%; background: rgba(249, 247, 244, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--soft); }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.2em; text-decoration: none; color: var(--ink); }
  .cart-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; position: relative; }
  .cart-count { position: absolute; top: -5px; right: -10px; background: var(--accent); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }
  
  /* 商品卡片 */
  .product-card { background: white; border: 1px solid #f0f0f0; cursor: pointer; transition: 0.3s; }
  .product-card:hover { border-color: var(--accent); }
  .img-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; }
  .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
  .p-info { padding: 20px; text-align: center; }
  .p-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 5px; }
  .p-price { font-family: 'Cormorant Garamond', serif; color: var(--accent); }

  /* 全螢幕詳情頁 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 2000; overflow-y: auto; }
  .detail-page { background: white; width: 100%; max-width: 800px; margin: 50px auto; position: relative; padding: 40px; border-radius: 8px; }
  .close-detail { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; border: none; background: none; }
  
  .detail-flex { display: flex; gap: 40px; flex-wrap: wrap; }
  .detail-img { flex: 1; min-width: 300px; }
  .detail-img img { width: 100%; border-radius: 4px; }
  .detail-content { flex: 1.2; min-width: 300px; }
  
  .info-tag { font-size: 0.75rem; background: #f5f5f5; padding: 4px 10px; border-radius: 2px; color: #666; margin-right: 10px; display: inline-block; margin-bottom: 10px; }
  .info-label { font-size: 0.85rem; font-weight: 500; margin-top: 20px; display: block; }
  
  /* 按鈕與規格樣式 */
  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
  .chip.selected { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .add-btn { width: 100%; padding: 16px; background: #1a1a1a; color: white; border: none; margin-top: 30px; cursor: pointer; letter-spacing: 0.1em; }

  /* 購物車側欄 */
  #cartDrawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; background: white; z-index: 2001; transform: translateX(100%); transition: 0.4s; padding: 30px; display: flex; flex-direction: column; }
  #cartDrawer.show { transform: translateX(0); }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">PAW<span>S</span></a>
  <button class="cart-btn" onclick="toggleCart(true)">🛍 <span class="cart-count" id="cartCount">0</span></button>
</nav>

<div class="container">
  <div class="products-grid" id="productGrid"></div>
</div>

<!-- 詳情頁遮罩 -->
<div class="overlay" id="detailOverlay">
  <div class="detail-page" id="detailContent">
    <!-- JS 會將內容填入這裡 -->
  </div>
</div>

<!-- 購物車 -->
<div id="cartDrawer">
  <h2 style="font-family: 'Cormorant Garamond'; margin-bottom: 20px;">Shopping Bag</h2>
  <div id="cartItems" style="flex: 1; overflow-y: auto;"></div>
  <div id="cartTotal" style="padding-top: 20px; border-top: 1px solid #eee; font-size: 1.2rem; display: flex; justify-content: space-between;">
    <span>Total</span><span>NT$ 0</span>
  </div>
  <button class="add-btn" onclick="openCheckout()">PROCEED TO CHECKOUT</button>
</div>

<script>
  const SHEET_ID = "1w0TnBgPXoN7geL4XjPpAW5D2Flok6kwXxfUzr72gSBc";
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let PRODUCTS = [];
  let cart = [];
  let currentProduct = null;
  let selectedVariants = {};

  async function fetchProducts() {
    try {
      const resp = await fetch(SHEET_URL);
      const text = await resp.text();
      const json = JSON.parse(text.substr(47).slice(0, -2));
      PRODUCTS = json.table.rows.map((r, i) => ({
        id: i + 1,
        name: r.c[1]?.v || "",
        price: r.c[2]?.v || 0,
        img: r.c[3]?.v || "",
        variants: r.c[4]?.v || "",
        shipTime: r.c[5]?.v || "一般出貨",
        bonus: r.c[6]?.v || "無特別福利",
        detailImgs: r.c[7]?.v || "" // 欄位 H
      }));
      renderProducts();
    } catch (e) { console.error("資料載入失敗", e); }
  }

  function renderProducts() {
    document.getElementById('productGrid').innerHTML = PRODUCTS.map(p => `
      <div class="product-card" onclick="openDetail(${p.id})">
        <div class="img-box"><img src="${p.img}"></div>
        <div class="p-info">
          <div class="p-name">${p.name}</div>
          <div class="p-price">NT$ ${p.price.toLocaleString()}</div>
        </div>
      </div>
    `).join('');
  }

  function openDetail(id) {
    currentProduct = PRODUCTS.find(p => p.id === id);
    selectedVariants = {};
    const overlay = document.getElementById('detailOverlay');
    const content = document.getElementById('detailContent');
    
    let variantsHTML = "";
    if (currentProduct.variants) {
      currentProduct.variants.split('|').forEach(g => {
        const [label, opts] = g.split(':');
        variantsHTML += `
          <span class="info-label">${label}</span>
          <div class="chip-container">
            ${opts.split(',').map((o, idx) => `
              <div class="chip ${idx === 0 ? 'selected' : ''}" onclick="selectChip(this, '${label}', '${o.trim()}')">${o.trim()}</div>
            `).join('')}
          </div>
        `;
        selectedVariants[label] = opts.split(',')[0].trim();
      });
    }

    // 實拍圖處理
    const extraImgs = currentProduct.detailImgs ? currentProduct.detailImgs.split(',').map(src => `<img src="${src.trim()}" style="width:100%; margin-top:15px;">`).join('') : "";

    content.innerHTML = `
      <button class="close-detail" onclick="closeDetail()">✕</button>
      <div class="detail-flex">
        <div class="detail-img">
          <img src="${currentProduct.img}">
          ${extraImgs}
        </div>
        <div class="detail-content">
          <h1 style="font-size:1.5rem; margin-bottom:10px;">${currentProduct.name}</h1>
          <p style="color:var(--accent); font-size:1.3rem; margin-bottom:20px;">NT$ ${currentProduct.price.toLocaleString()}</p>
          
          <div>
            <span class="info-tag">出貨時間：${currentProduct.shipTime}</span>
            <span class="info-tag">滿額福利：${currentProduct.bonus}</span>
          </div>

          <div style="margin-top:20px; border-top:1px solid #eee; padding-top:20px;">
            ${variantsHTML}
            <span class="info-label">購買數量</span>
            <div style="display:flex; align-items:center; gap:20px; margin-top:10px;">
              <button onclick="changeQty(-1)" style="width:30px; height:30px; border:1px solid #ddd;">-</button>
              <span id="detailQty">1</span>
              <button onclick="changeQty(1)" style="width:30px; height:30px; border:1px solid #ddd;">+</button>
            </div>
            <button class="add-btn" onclick="addToBag()">ADD TO BAG</button>
          </div>
        </div>
      </div>
    `;
    overlay.style.display = "block";
  }

  function selectChip(el, label, val) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedVariants[label] = val;
  }

  let currentQty = 1;
  function changeQty(n) {
    currentQty = Math.max(1, currentQty + n);
    document.getElementById('detailQty').innerText = currentQty;
  }

  function addToBag() {
    const variantStr = Object.values(selectedVariants).join(' / ') || "Standard";
    const key = `${currentProduct.id}-${variantStr}`;
    const exist = cart.find(i => `${i.id}-${i.variant}` === key);
    if(exist) exist.qty += currentQty;
    else cart.push({...currentProduct, variant: variantStr, qty: currentQty});
    
    closeDetail();
    updateCartUI();
    toggleCart(true);
  }

  function closeDetail() { document.getElementById('detailOverlay').style.display = "none"; currentQty = 1; }
  function toggleCart(show) { document.getElementById('cartDrawer').classList.toggle('show', show); }
  function updateCartUI() {
    document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
    // ...其餘購物車更新邏輯與先前相同
  }

  window.onload = fetchProducts;
</script>
</body>
</html>
